<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>旅行攻略合集</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20211f;
        --muted: #686f67;
        --line: #d9ded4;
        --paper: #f8faf4;
        --green: #2f6f54;
        --blue: #246b8f;
        --coral: #bb5a43;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: linear-gradient(180deg, #fbfcf7 0%, #eff4ed 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1060px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0 0 14px;
        font-size: clamp(40px, 7vw, 72px);
        line-height: 1.02;
      }

      .summary {
        max-width: 720px;
        margin: 0 0 32px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }

      .guide-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }

      .guide-card {
        display: grid;
        gap: 14px;
        min-height: 230px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 45px rgba(38, 45, 37, 0.12);
        text-decoration: none;
      }

      .guide-card:hover {
        border-color: var(--green);
      }

      .guide-card h2 {
        margin: 0;
        font-size: 26px;
      }

      .guide-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: auto;
      }

      .meta-row span {
        padding: 5px 9px;
        border-radius: 999px;
        color: #315b49;
        background: #edf3e8;
        font-size: 12px;
        font-weight: 750;
      }

      .open-link {
        color: var(--coral);
        font-weight: 820;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Travel Guides</p>
      <h1>旅行攻略合集</h1>
      <p class="summary">
        把每一次旅行都整理成可以分享的互动攻略：路线、航班、住宿、景点、地图和准备清单都放在一个入口里。
      </p>

      <section class="guide-grid" aria-label="旅行攻略列表">
        <a class="guide-card" href="./xiaoxinganling-2026-mid-autumn/">
          <div>
            <h2>中秋小兴安岭</h2>
            <p>哈尔滨出发，经伊春、汤旺、嘉荫到佳木斯的五花山自驾，含每日路线、住宿点与赏秋地图。</p>
          </div>
          <div class="meta-row">
            <span>2026 中秋</span>
            <span>5 天</span>
            <span>黑龙江</span>
          </div>
          <span class="open-link">打开攻略</span>
        </a>
        <a class="guide-card" href="./egypt-2026-may/">
          <div>
            <h2>五一埃及自驾</h2>
            <p>开罗、赫尔格达、卢克索、阿斯旺、阿布辛贝和马特鲁港，含 Leaflet 互动地图与每日路线。</p>
          </div>
          <div class="meta-row">
            <span>2026 五一</span>
            <span>10 天</span>
            <span>埃及</span>
          </div>
          <span class="open-link">打开攻略</span>
        </a>
      </section>
    </main>
  </body>
</html>
