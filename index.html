<!doctype html>
<html lang="zh-CN" data-encrypted-site>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>旅行攻略 · 访问验证</title>
  <style>
    :root{color-scheme:light;--ink:#18231f;--muted:#617068;--line:#cbd6cf;--paper:#f3f7f2;--panel:#fff;--green:#215a45;--gold:#c38a25}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px;color:var(--ink);background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    main{width:min(100%,420px);padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 20px 54px rgba(28,61,47,.13)}
    .eyebrow{margin:0 0 8px;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.12em}
    h1{margin:0 0 10px;font:700 32px/1.15 Georgia,"Songti SC",serif}
    p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.65}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:850}
    input{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff;font:700 16px/1 sans-serif}
    input:focus{border-color:var(--green);outline:3px solid rgba(33,90,69,.16)}
    button{width:100%;min-height:46px;margin-top:12px;border:1px solid var(--green);border-radius:6px;color:#fff;background:var(--green);font-size:14px;font-weight:900;cursor:pointer}
    button:hover{background:#174634}
    button:disabled{cursor:wait;opacity:.7}
    #status{min-height:22px;margin:12px 0 0;color:#a23f2c;font-size:12px;font-weight:750}
    .security-note{padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PRIVATE TRAVEL GUIDE</p>
    <h1>输入访问密码</h1>
    <p>内容已在发布前加密。密码只在当前浏览器标签页中用于解锁。</p>

      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="unlockButton" type="submit">解锁攻略</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="security-note">关闭标签页或点击“锁定攻略”后，需要重新输入密码。</p>

    const storageKey="travel-guides:aes-key";
    const encoder=new TextEncoder();
    const decoder=new TextDecoder();
    const form=document.querySelector("#unlockForm");
    const input=document.querySelector("#password");
    const button=document.querySelector("#unlockButton");
    const status=document.querySelector("#status");
    const fromBase64=value=>Uint8Array.from(atob(value),character=>character.charCodeAt(0));
    const toBase64=value=>{let binary="";for(const byte of new Uint8Array(value))binary+=String.fromCharCode(byte);return btoa(binary)};
    async function importSessionKey(value){return crypto.subtle.importKey("raw",fromBase64(value),{name:"AES-GCM"},true,["decrypt"])}
    async function deriveKey(password){
      const material=await crypto.subtle.importKey("raw",encoder.encode(password),"PBKDF2",false,["deriveKey"]);
      return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",iterations:payload.iterations,salt:fromBase64(payload.salt)},material,{name:"AES-GCM",length:256},true,["decrypt"]);
    }
    async function decrypt(key){
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromBase64(payload.iv),additionalData:encoder.encode(payload.aad),tagLength:128},key,fromBase64(payload.ciphertext));
      return decoder.decode(plain);
    }
    function openGuide(html){
      const parsed=new DOMParser().parseFromString(html,"text/html");
      document.documentElement.lang=parsed.documentElement.lang||"zh-CN";
      document.documentElement.removeAttribute("data-encrypted-site");
      document.head.replaceChildren(...parsed.head.childNodes);
      document.body.replaceChildren(...parsed.body.childNodes);
      for(const inert of [...document.querySelectorAll("script")]){
        const active=document.createElement("script");
        for(const attribute of inert.attributes)active.setAttribute(attribute.name,attribute.value);
        active.textContent=inert.textContent;
        inert.replaceWith(active);
      }
    }
    async function unlockWithKey(key,remember){
      const html=await decrypt(key);
      if(remember){const raw=await crypto.subtle.exportKey("raw",key);sessionStorage.setItem(storageKey,toBase64(raw))}
      openGuide(html);
    }
    form.addEventListener("submit",async event=>{
      event.preventDefault();button.disabled=true;status.textContent="正在解锁…";
      try{await unlockWithKey(await deriveKey(input.value),true)}catch(error){input.value="";input.focus();status.textContent="密码不正确，请重新输入。";button.disabled=false}
    });
    (async()=>{
      const saved=sessionStorage.getItem(storageKey);
      if(!saved)return;
      status.textContent="正在恢复本次访问…";
      try{await unlockWithKey(await importSessionKey(saved),false)}catch(error){sessionStorage.removeItem(storageKey);status.textContent=""}
    })();
  </script>
